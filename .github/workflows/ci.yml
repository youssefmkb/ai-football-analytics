name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afa
          POSTGRES_PASSWORD: afa
          POSTGRES_DB: afa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afa -d afa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Running on PostgreSQL applies the real migrations and enables the
      # row-level security tests, which are skipped on SQLite.
      TEST_DATABASE_URL: postgresql+psycopg://afa:afa@localhost:5432/afa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
